{% extends "dashboard/base.html" %}
{% block title %}Settings - ProxyMonitor{% endblock %}

{% block content %}
<div class="mb-6">
    <h2 class="text-2xl font-bold text-white">Settings</h2>
    <p class="text-gray-500">Manage your account settings</p>
</div>

<div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
    <!-- Profile -->
    <div class="bg-dark-900 rounded-xl border border-gray-800 p-6">
        <h3 class="text-lg font-semibold text-white mb-4">Profile Information</h3>
        <form method="POST">
            {% csrf_token %}
            <input type="hidden" name="action" value="update_profile">
            <div class="space-y-4">
                <div>
                    <label class="text-gray-400 text-sm">Username</label>
                    <input type="text" value="{{ request.user.username }}" disabled 
                           class="w-full bg-dark-800 border border-gray-700 rounded-lg px-3 py-2 text-gray-500">
                </div>
                <div>
                    <label class="text-gray-400 text-sm">Email</label>
                    <input type="email" name="email" value="{{ request.user.email }}" 
                           class="w-full bg-dark-800 border border-gray-700 rounded-lg px-3 py-2 text-white">
                </div>
                <div>
                    <label class="text-gray-400 text-sm">Role</label>
                    <input type="text" value="{{ request.user.profile.get_role_display }}" disabled 
                           class="w-full bg-dark-800 border border-gray-700 rounded-lg px-3 py-2 text-gray-500">
                </div>
                <div>
                    <label class="text-gray-400 text-sm">Department</label>
                    <input type="text" name="department" value="{{ request.user.profile.department|default:'' }}" 
                           class="w-full bg-dark-800 border border-gray-700 rounded-lg px-3 py-2 text-white">
                </div>
                <div>
                    <label class="text-gray-400 text-sm">Phone</label>
                    <input type="text" name="phone" value="{{ request.user.profile.phone|default:'' }}" 
                           class="w-full bg-dark-800 border border-gray-700 rounded-lg px-3 py-2 text-white">
                </div>
            </div>
            <button type="submit" class="mt-4 bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg">
                Save Changes
            </button>
        </form>
    </div>

    <!-- Change Password -->
    <div class="bg-dark-900 rounded-xl border border-gray-800 p-6">
        <h3 class="text-lg font-semibold text-white mb-4">Change Password</h3>
        <form method="POST">
            {% csrf_token %}
            <input type="hidden" name="action" value="change_password">
            <div class="space-y-4">
                <div>
                    <label class="text-gray-400 text-sm">Current Password</label>
                    <input type="password" name="current_password" required 
                           class="w-full bg-dark-800 border border-gray-700 rounded-lg px-3 py-2 text-white">
                </div>
                <div>
                    <label class="text-gray-400 text-sm">New Password</label>
                    <input type="password" name="new_password" required 
                           class="w-full bg-dark-800 border border-gray-700 rounded-lg px-3 py-2 text-white">
                </div>
                <div>
                    <label class="text-gray-400 text-sm">Confirm New Password</label>
                    <input type="password" name="confirm_password" required 
                           class="w-full bg-dark-800 border border-gray-700 rounded-lg px-3 py-2 text-white">
                </div>
            </div>
            <button type="submit" class="mt-4 bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg">
                Change Password
            </button>
        </form>
    </div>
</div>
{% endblock %}
